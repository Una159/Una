name: Build K-Douyin Ultra

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build iOS tweak
    runs-on: macos-14

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Theos
        uses: beerpsi/setup-theos@v1
        with:
          theos-src: https://github.com/theos/theos
          theos-sdks: https://github.com/theos/sdks

      - name: Check project files
        run: |
          test -f Makefile
          test -f KDU.xm
          test -f control

      - name: Build package
        run: |
          export THEOS="$GITHUB_WORKSPACE/theos"
          make clean
          make package FINALPACKAGE=1

      - name: Collect outputs
        if: success()
        run: |
          mkdir -p dist
          find packages -type f -name '*.deb' -exec cp {} dist/ \;
          find .theos -type f -name 'KDouyinUltra.dylib' -exec cp {} dist/ \;
          ls -lh dist
          test -n "$(find dist -type f -print -quit)"

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: K-Douyin-Ultra-build
          path: dist/*
          if-no-files-found: error
          retention-days: 14