name: Build K-Douyin Ultra

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build iOS tweak
    runs-on: macos-14

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Theos
        shell: bash
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          set -euo pipefail
          brew install ldid xz
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/sdks"

          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT

          curl --retry 3 --retry-delay 2 -fL \
            https://codeload.github.com/theos/sdks/zip/refs/heads/master \
            -o "$TMP_DIR/sdks.zip"

          unzip -q "$TMP_DIR/sdks.zip" -d "$TMP_DIR"

          find "$TMP_DIR/sdks-master" -mindepth 1 -maxdepth 1 \
            -type d -name '*.sdk' \
            -exec mv {} "$THEOS/sdks/" \;

          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "Installed SDKs:"
          ls -la "$THEOS/sdks"

          test -n "$(find "$THEOS/sdks" -maxdepth 1 -type d -name '*.sdk' -print -quit)"

      - name: Check project files
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking project files..."
          test -f Makefile || { echo "Missing Makefile in repository root"; exit 1; }
          test -f KDU.xm || { echo "Missing KDU.xm in repository root"; exit 1; }
          test -f control || { echo "Missing control in repository root"; exit 1; }
          echo "Required project files found."

      - name: Build package
        shell: bash
        run: |
          set -euo pipefail
          make clean
          make package FINALPACKAGE=1

      - name: Collect outputs
        shell: bash
        if: success()
        run: |
          set -euo pipefail
          mkdir -p dist
          find packages -type f -name '*.deb' -exec cp {} dist/ \; 2>/dev/null || true
          find .theos -type f -name 'KDouyinUltra.dylib' -exec cp {} dist/ \; 2>/dev/null || true
          echo "Build outputs:"
          find dist -maxdepth 1 -type f -print
          if [ -z "$(find dist -maxdepth 1 -type f -print -quit)" ]; then
            echo "ERROR: No build artifacts found."
            exit 1
          fi

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: K-Douyin-Ultra-build
          path: dist/*
          if-no-files-found: error
          retention-days: 14