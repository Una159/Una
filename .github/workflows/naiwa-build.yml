name: NaiWa Theos Build

on:
  push:
    branches:
      - naiwa-reconstruction
    paths:
      - "NaiWa/**"
      - ".github/workflows/naiwa-build.yml"
  workflow_dispatch:

concurrency:
  group: naiwa-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew install ldid dpkg

      - name: Install Theos and iOS SDK
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 --recursive https://github.com/theos/theos.git "$HOME/theos"
          git clone --depth=1 https://github.com/theos/sdks.git "$RUNNER_TEMP/theos-sdks"
          mkdir -p "$HOME/theos/sdks"
          cp -R "$RUNNER_TEMP/theos-sdks/." "$HOME/theos/sdks/"

      - name: Build rootless package
        working-directory: NaiWa
        shell: bash
        run: |
          set -euo pipefail
          export THEOS="$HOME/theos"
          make clean
          make package FINALPACKAGE=1
          test -n "$(find packages -maxdepth 1 -name '*.deb' -print -quit)"

      - name: Validate Debian package
        working-directory: NaiWa
        run: |
          set -euo pipefail
          for package in packages/*.deb; do
            dpkg-deb --info "$package"
            dpkg-deb --contents "$package"
          done

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: NaiWa-rootless-deb
          path: NaiWa/packages/*.deb
          if-no-files-found: error
          retention-days: 14
