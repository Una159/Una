name: Una Gateway Validation

on:
  push:
    branches:
      - feature/una-ios-xcode
    paths:
      - "UnaMusicPlayer/CloudflareGateway/**"
      - ".github/workflows/una-gateway-check.yml"
  pull_request:
    paths:
      - "UnaMusicPlayer/CloudflareGateway/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: UnaMusicPlayer/CloudflareGateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: UnaMusicPlayer/CloudflareGateway/package.json
      - name: Generate lockfile for bootstrap
        id: lockfile
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
            echo "generated=true" >> "$GITHUB_OUTPUT"
          else
            echo "generated=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Type check and smoke tests
        run: npm test
      - name: Generate supply-chain inventory
        run: |
          mkdir -p artifacts
          npm sbom --sbom-format=cyclonedx --sbom-type=application > artifacts/una-gateway.cdx.json
          cp package-lock.json artifacts/package-lock.json
      - name: Upload lockfile and SBOM
        uses: actions/upload-artifact@v4
        with:
          name: una-gateway-supply-chain-${{ github.sha }}
          path: UnaMusicPlayer/CloudflareGateway/artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Commit generated dependency lockfile
        if: steps.lockfile.outputs.generated == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/feature/una-ios-xcode'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(gateway): add generated npm lockfile [skip ci]"
          git push origin HEAD:feature/una-ios-xcode
