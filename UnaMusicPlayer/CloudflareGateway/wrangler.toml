name = "una-music-gateway"
main = "src/index.ts"
compatibility_date = "2026-11-10"

[vars]
# Configure these as HTTPS origins in Cloudflare Worker settings.
# NETEASE_ORIGIN = "https://your-netease-api.example"
# KUGOU_ORIGIN = "https://your-kugou-api.example"
# QISHUI_ORIGIN = "https://your-qishui-api.example"
# QQMUSIC_ORIGIN = "https://your-qqmusic-api.example"
# ALLOWED_ORIGIN = "https://your-app-domain.example"

[observability]
enabled = true
head_sampling_rate = 0.1

# After creating a KV namespace, bind it here:
# [[kv_namespaces]]
# binding = "QR_SESSIONS"
# id = "REPLACE_WITH_KV_NAMESPACE_ID"
